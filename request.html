<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a Service | BayanConnect</title><link rel="stylesheet" href="assets/css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html">BayanConnect</a><div class="nav-links"><a href="index.html#services">Services</a><a href="index.html#announcements">Announcements</a><a href="request.html">Request a Service</a><a href="admin/login.html">Admin</a></div></div></nav><main class="container narrow page-space"><section class="card form-card"><p class="eyebrow">ONLINE SERVICE</p><h1>Request a Community Service</h1><p class="muted">Complete the form below. Your request will be sent to the community office.</p><div id="notice" aria-live="polite"></div><form id="request-form"><div class="form-group"><label for="resident_name">Full Name *</label><input id="resident_name" name="resident_name" required maxlength="150"></div><div class="form-group"><label for="contact">Contact Information</label><input id="contact" name="contact" maxlength="100" placeholder="Phone or email"></div><div class="form-group"><label for="service_id">Service *</label><select id="service_id" name="service_id" required><option value="">Loading services…</option></select></div><div class="form-group"><label for="purpose">Purpose / Details *</label><textarea id="purpose" name="purpose" required rows="5" maxlength="5000"></textarea></div><button class="btn btn-green" type="submit">Submit Request</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script></body></html>
